[build-system]
requires = [
    "setuptools>=68",
    "setuptools_scm[toml]>=8.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT METADATA
# =============================================================================
[project]
name = "surmod"
dynamic = ["version"]  # Fully automatic from git tags (e.g. v0.3.0)
description = "Generalized Fourier Response Networks (GFR-Net) for fast surrogate modeling of RF and electromagnetic responses."
readme = "README.md"
#license = "MIT"
#license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Joshua Pugh", email = "joshua.pugh@thalesgroup.com"},
]
maintainers = [
    {name = "Joshua Pugh", email = "joshua.pugh@thalesgroup.com"},
]
# NOTE: previously empty -- `pip install surmod` pulled in none of the
# packages the code actually imports (torch, numpy, h5py, pandas, optuna,
# matplotlib, tqdm, pyyaml). torch is listed separately as the `torch`
# extra so users needing a specific CUDA build can install it themselves
# first (per the README) without pip fighting over the version.
dependencies = [
    "numpy",
    "h5py",
    "pandas",
    "optuna",
    "matplotlib",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
torch = ["torch"]



[tool.setuptools.packages.find]
where = ["src"]
include = ["surmod*"]
exclude = ["tests*", "docs*", "*.tests*"]


