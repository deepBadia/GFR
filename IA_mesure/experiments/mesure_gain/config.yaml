# mesure_gain.h5 -- antenna gain measurements.
#
# CONFIRMED (by the data owner): the h5 column names "theta" and "freq" are
# swapped relative to their actual content:
#   - the column literally named "theta" is actually the frequency sweep
#     (2..11 GHz, 37 points, 0.25 GHz step -- matches mesure_couplage.h5's
#     "ant_nb" column exactly: same range/count/step, same measurement setup)
#   - the column literally named "freq" is actually the observation angle
#     theta (-90..90 deg, 91 points, 2 deg step)
# So below, axis_column/X_columns use the h5 column names as they exist in
# the file, but mapped to their REAL physical meaning: axis_column="theta"
# (the h5 column, which is really frequency) is the continuous sweep, and
# X_columns=["freq"] (the h5 column, which is really the angle) is the
# geometry-like parameter -- one gain(frequency) curve per observation angle.

templates:

  base:
    common:
      data_file: "mesure_gain.h5"
      n_out: 1
      complex: false
      complex_format: null
      seed: 42
      verbose: true
      cuda_nb: 0
    dataset:
      X_columns: ["freq"]            # h5 column "freq" -- really the observation angle theta
      Y_columns: ["gain"]
      axis_column: "theta"           # h5 column "theta" -- really the frequency sweep (2-11 GHz)
      index_column: "index"
      weights_type: "equal"
      val_split: 0.20
      size: 74                       # ~80% of the 91 angle values ("freq" column) -> pool; 17 held out as test
      display_names:                 # plot labels use REAL physical meaning, not the swapped h5 names
        freq: "theta (deg)"
        theta: "freq (GHz)"

  model_gfr:
    common:
      model_name: "GFR_Net"
    model:
      hidden_dim: 192
      n_fourier: 48
      n_layers: 5
      n_out_layers: 3
      dropout: 0.05
      n_encoder_layers: 1
      use_film: true

  model_active_gfr:
    common:
      model_name: "active_gfr_net"
    model:
      hidden_dim: 192
      n_fourier: 48
      n_layers: 5
      n_out_layers: 3
      dropout: 0.05
      n_encoder_layers: 1
      use_film: true
      mc_dropout: 0.20

  train_standard:
    training:
      epochs: 1000
      patience: 1000
      patience_start: 250
      batch_size: 64
      lr: 0.0004
      w_decay: 0.00006
      cosine_T0: 150
      metric: "weighted_mse"

  tuning_search:
    tuning:
      hidden_dim: [64, 128, 192, 256]
      n_fourier: [16, 32, 48, 64]
      n_layers: [3, 8]
      dropout: [0.0, 0.4]
      lr: [1.0e-5, 1.0e-2]
      w_decay: [1.0e-7, 1.0e-2]
      batch_size: [32, 64, 128]

experiments:

  mesure_gain_gfr:
    inherit: [base, model_gfr, train_standard, tuning_search]
    common:
      save_name: "baseline"

  mesure_gain_active_gfr:
    inherit: [base, model_active_gfr, train_standard]
    common:
      save_name: "active"
